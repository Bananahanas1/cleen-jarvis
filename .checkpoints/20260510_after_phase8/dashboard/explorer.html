<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis File Explorer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-color: #1f4e68 #03070d; scrollbar-width: thin; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: #03070d; }
    *::-webkit-scrollbar-thumb { background: #1f4e68; border-radius: 6px; }
    *::-webkit-scrollbar-thumb:hover { background: #2d7594; }

    body {
      background: #050910; color: #dff7ff;
      font-family: Consolas, 'Cascadia Code', monospace;
      height: 100vh; overflow: hidden;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 44px 1fr;
      height: 100vh;
    }
    .toolbar {
      grid-column: 1 / -1;
      background: #08111f;
      border-bottom: 1px solid #193247;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
    }
    .toolbar h1 { font-size: 14px; color: #44d9ff; font-weight: normal; }
    .toolbar .root-pill {
      background: #102b3d; border: 1px solid #1f4e68;
      border-radius: 12px; padding: 3px 10px; font-size: 11px;
      cursor: pointer;
    }
    .toolbar .root-pill.active { background: #1c4f6e; border-color: #44d9ff; }
    .toolbar .root-pill.readonly { color: #ffaa66; }
    .toolbar .spacer { flex: 1; }
    .toolbar input {
      background: #03070d; border: 1px solid #1f4e68; color: #dff7ff;
      padding: 5px 10px; border-radius: 6px; width: 220px; font-family: inherit; font-size: 12px;
    }

    .tree-pane {
      background: #08111f; border-right: 1px solid #193247;
      overflow-y: auto; padding: 8px 6px;
    }
    .tree-row {
      padding: 3px 8px; cursor: pointer; border-radius: 4px;
      font-size: 12px; line-height: 1.5; user-select: none;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-row:hover { background: #102b3d; }
    .tree-row.active { background: #1c4f6e; color: #fff; }
    .tree-row.dir > .name { color: #ffd966; }
    .tree-row.file > .name { color: #80ff96; }
    .tree-row.readonly > .name { opacity: 0.65; }
    .tree-row .chevron { width: 10px; opacity: 0.6; }
    .tree-row.dir.expanded .chevron::before { content: "▾"; }
    .tree-row.dir.collapsed .chevron::before { content: "▸"; }
    .tree-row.file .chevron { visibility: hidden; }
    .tree-children { margin-left: 14px; border-left: 1px dotted #1a3550; padding-left: 4px; }

    .editor-pane {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }
    .tabs {
      display: flex; gap: 2px; background: #06101d; border-bottom: 1px solid #193247;
      overflow-x: auto; min-height: 32px;
    }
    .tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; font-size: 12px;
      background: #08111f; border-right: 1px solid #193247;
      cursor: pointer; white-space: nowrap;
    }
    .tab.active { background: #102b3d; color: #fff; border-bottom: 2px solid #44d9ff; }
    .tab.dirty::after { content: "●"; color: #ffaa66; margin-left: 4px; }
    .tab .close { opacity: 0.5; }
    .tab .close:hover { opacity: 1; color: #ff8888; }

    .editor-area {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
    }
    .editor-meta {
      display: flex; gap: 12px; padding: 6px 12px;
      background: #06101d; border-bottom: 1px solid #193247;
      font-size: 11px; opacity: 0.85;
    }
    .editor-meta .badge { padding: 1px 8px; border-radius: 8px; background: #102b3d; }
    .editor-meta .badge.readonly { background: #4a2a1a; color: #ffaa66; }
    .editor-meta .badge.writable { background: #1a3a2a; color: #80ff96; }

    textarea#editor {
      flex: 1; resize: none; border: none; outline: none;
      background: #050910; color: #cfeaff;
      font-family: 'Cascadia Code', Consolas, monospace; font-size: 13px;
      padding: 14px; line-height: 1.5;
    }
    textarea#editor:read-only { background: #03070d; color: #99bbcc; }

    .actions {
      display: flex; gap: 8px; padding: 8px 12px;
      background: #06101d; border-top: 1px solid #193247;
    }
    .actions button {
      background: #102b3d; color: #dff7ff; border: 1px solid #44d9ff;
      border-radius: 6px; padding: 5px 12px; cursor: pointer; font-family: inherit; font-size: 12px;
    }
    .actions button:hover { background: #1c4f6e; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
    .actions .status { flex: 1; align-self: center; font-size: 11px; opacity: 0.7; }

    .empty-state {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; opacity: 0.6; gap: 8px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <header class="toolbar">
      <h1>File Explorer</h1>
      <button class="root-pill active" data-root="clean">Jarvis-clean</button>
      <button class="root-pill readonly" data-root="newproject" title="Read-only referens">F:\New project (read-only)</button>
      <div class="spacer"></div>
      <input id="filter" placeholder="Filtrera (path innehåller...)">
    </header>

    <aside class="tree-pane" id="treePane"></aside>

    <main class="editor-pane">
      <div class="tabs" id="tabs"></div>
      <div class="editor-area" id="editorArea">
        <div class="empty-state" id="emptyState">
          <div style="font-size:14px;color:#44d9ff;">Ingen fil öppen</div>
          <div>Klicka på en fil i vänsterpanelen för att öppna den.</div>
        </div>
        <div class="editor-meta" id="editorMeta" style="display:none;">
          <span id="metaPath"></span>
          <span class="badge" id="metaRoot">--</span>
          <span class="badge" id="metaMode">--</span>
        </div>
        <textarea id="editor" spellcheck="false" readonly placeholder="Filinnehåll visas här." style="display:none;"></textarea>
        <div class="actions" id="actions" style="display:none;">
          <button id="editBtn">Edit-läge</button>
          <button id="saveBtn" disabled>Spara med godkännande</button>
          <span class="status" id="actionStatus">Read-only.</span>
        </div>
      </div>
    </main>
  </div>

  <script>
    // FileExplorerWindow Fas 4 — multi-tab editor + multi-root tree.
    // Säkerhet: All skrivning postas till C# som "fileexplorer_save_pending" — main JarvisForm
    // hanterar PendingApprovalV1. Detta UI skriver aldrig direkt till disk.
    //
    // Multi-root: F:\Jarvis-clean (write via approval) + F:\New project (read-only).

    const ROOTS = {
      clean: { path: "F:\\Jarvis-clean", label: "Jarvis-clean", readonly: false },
      newproject: { path: "F:\\New project", label: "F:\\New project", readonly: true }
    };
    let activeRoot = "clean";
    const tabs = []; // {root, relPath, content, dirty, readonly}
    let activeTabIndex = -1;

    function postC(payload) {
      try { window.chrome?.webview?.postMessage(payload); } catch (e) {}
    }

    // === Tree rendering ===
    function renderTree(rootKey, items) {
      const pane = document.getElementById("treePane");
      pane.innerHTML = "";
      const filter = (document.getElementById("filter").value || "").toLowerCase();
      const filtered = filter
        ? items.filter(i => i.path.toLowerCase().includes(filter))
        : items;

      // Group by parent dir; flatten for simplicity (Fas 4 ger en platt sorterad lista; Fas 5+ kan ge full tree).
      const sorted = [...filtered].sort((a, b) => {
        if (a.kind !== b.kind) return a.kind === "dir" ? -1 : 1;
        return a.path.localeCompare(b.path);
      });

      for (const item of sorted) {
        const row = document.createElement("div");
        row.className = "tree-row " + item.kind;
        if (ROOTS[rootKey].readonly) row.classList.add("readonly");
        row.innerHTML = `<span class="chevron"></span><span class="name">${item.path}</span>`;
        row.title = item.path + (ROOTS[rootKey].readonly ? " (read-only)" : "");
        row.addEventListener("click", () => {
          if (item.kind === "file") openFile(rootKey, item.path);
        });
        pane.appendChild(row);
      }
    }

    function requestTree(rootKey) {
      activeRoot = rootKey;
      document.querySelectorAll(".root-pill").forEach(p =>
        p.classList.toggle("active", p.dataset.root === rootKey));
      postC({ type: "fileexplorer_list_tree", root: rootKey, rootPath: ROOTS[rootKey].path });
    }

    // === Tab management ===
    function renderTabs() {
      const bar = document.getElementById("tabs");
      bar.innerHTML = "";
      tabs.forEach((tab, idx) => {
        const el = document.createElement("div");
        el.className = "tab" + (idx === activeTabIndex ? " active" : "") + (tab.dirty ? " dirty" : "");
        el.innerHTML = `<span>${tab.relPath}</span><span class="close" data-idx="${idx}">×</span>`;
        el.addEventListener("click", (e) => {
          if (e.target.classList.contains("close")) {
            closeTab(idx);
          } else {
            activateTab(idx);
          }
        });
        bar.appendChild(el);
      });
    }

    function activateTab(idx) {
      if (idx < 0 || idx >= tabs.length) {
        activeTabIndex = -1;
        document.getElementById("emptyState").style.display = "flex";
        document.getElementById("editorMeta").style.display = "none";
        document.getElementById("editor").style.display = "none";
        document.getElementById("actions").style.display = "none";
        return;
      }
      activeTabIndex = idx;
      const tab = tabs[idx];
      document.getElementById("emptyState").style.display = "none";
      document.getElementById("editorMeta").style.display = "flex";
      document.getElementById("editor").style.display = "block";
      document.getElementById("actions").style.display = "flex";
      document.getElementById("metaPath").textContent = tab.relPath;
      const rootMeta = document.getElementById("metaRoot");
      rootMeta.textContent = ROOTS[tab.root].label;
      const modeMeta = document.getElementById("metaMode");
      modeMeta.textContent = tab.readonly ? "read-only" : "writable via approval";
      modeMeta.className = "badge " + (tab.readonly ? "readonly" : "writable");
      const editor = document.getElementById("editor");
      editor.value = tab.content;
      editor.readOnly = true; // Edit-läge måste aktiveras explicit
      document.getElementById("saveBtn").disabled = true;
      document.getElementById("editBtn").disabled = tab.readonly;
      document.getElementById("actionStatus").textContent =
        tab.readonly ? "Read-only — F:\\New project är referens." : "Klicka Edit-läge för att redigera.";
      renderTabs();
    }

    function closeTab(idx) {
      if (tabs[idx]?.dirty) {
        if (!confirm("Stäng utan att spara? Ändringar går förlorade.")) return;
      }
      tabs.splice(idx, 1);
      if (activeTabIndex >= tabs.length) activeTabIndex = tabs.length - 1;
      activateTab(activeTabIndex);
    }

    function openFile(rootKey, relPath) {
      const existing = tabs.findIndex(t => t.root === rootKey && t.relPath === relPath);
      if (existing >= 0) { activateTab(existing); return; }
      // Request file content from C#
      postC({ type: "fileexplorer_open_file", root: rootKey, rootPath: ROOTS[rootKey].path, path: relPath });
    }

    // === C# → JS callbacks ===
    window.fileExplorerSetTree = function(rootKey, items) {
      renderTree(rootKey, items || []);
    };

    window.fileExplorerSetFile = function(rootKey, relPath, content, readonly) {
      tabs.push({
        root: rootKey,
        relPath,
        content: String(content || ""),
        dirty: false,
        readonly: !!readonly
      });
      activateTab(tabs.length - 1);
    };

    window.fileExplorerSaveResult = function(rootKey, relPath, ok, message) {
      const tab = tabs.find(t => t.root === rootKey && t.relPath === relPath);
      if (!tab) return;
      if (ok) {
        tab.dirty = false;
        document.getElementById("actionStatus").textContent = "Sparat (efter godkännande). " + (message || "");
        renderTabs();
      } else {
        document.getElementById("actionStatus").textContent = "Misslyckades: " + (message || "okänt fel");
      }
    };

    // === Wire up controls ===
    document.querySelectorAll(".root-pill").forEach(p =>
      p.addEventListener("click", () => requestTree(p.dataset.root)));

    document.getElementById("filter").addEventListener("input", () => {
      // Local filter — re-renders by asking for the same root again (server-side filtering can come later).
      // Simple: ask the C# to resend (caches in C# can serve quickly).
      postC({ type: "fileexplorer_list_tree", root: activeRoot, rootPath: ROOTS[activeRoot].path });
    });

    document.getElementById("editBtn").addEventListener("click", () => {
      if (activeTabIndex < 0) return;
      const tab = tabs[activeTabIndex];
      if (tab.readonly) return;
      const editor = document.getElementById("editor");
      editor.readOnly = false;
      document.getElementById("saveBtn").disabled = false;
      document.getElementById("actionStatus").textContent = "Edit-läge på. Klicka Spara med godkännande för att posta pending approval.";
      editor.focus();
    });

    document.getElementById("editor").addEventListener("input", () => {
      if (activeTabIndex < 0) return;
      const tab = tabs[activeTabIndex];
      if (tab.readonly) return;
      tab.content = document.getElementById("editor").value;
      tab.dirty = true;
      renderTabs();
    });

    document.getElementById("saveBtn").addEventListener("click", () => {
      if (activeTabIndex < 0) return;
      const tab = tabs[activeTabIndex];
      if (tab.readonly) return;
      // Post to C#; C# creates PendingApprovalV1.FileWrite and shows popup in main window.
      postC({
        type: "fileexplorer_save_pending",
        root: tab.root,
        rootPath: ROOTS[tab.root].path,
        path: tab.relPath,
        content: tab.content
      });
      document.getElementById("actionStatus").textContent = "Skickat till main för godkännande... Kontrollera Jarvis-fönstret.";
    });

    // Initial: ask for clean tree.
    requestTree("clean");
    postC({ type: "fileexplorer_ready" });
  </script>
</body>
</html>
