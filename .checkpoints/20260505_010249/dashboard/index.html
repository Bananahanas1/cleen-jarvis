<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    body {
      margin: 0;
      background: #050910;
      color: #dff7ff;
      font-family: Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .panel {
      width: min(1200px, calc(100vw - 30px));
      background: #08111f;
      border: 1px solid #1b9fd6;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0, 180, 255, 0.15);
    }

    h1 {
      margin-top: 0;
      color: #44d9ff;
      font-size: 22px;
    }

    .warning {
      color: #ffaa44;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    #messages {
      height: calc(100vh - 260px);
      overflow-y: auto;
      background: #03070d;
      border: 1px solid #193247;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .msg {
      margin: 8px 0;
      padding: 8px;
      border-radius: 8px;
    }

    .user {
      background: rgba(68, 217, 255, 0.12);
      border-left: 3px solid #44d9ff;
    }

    .assistant {
      background: rgba(80, 255, 150, 0.10);
      border-left: 3px solid #50ff96;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      background: #03070d;
      color: white;
      border: 1px solid #24465f;
      border-radius: 8px;
      padding: 12px;
      font-family: inherit;
    }

    button {
      background: #102b3d;
      color: #dff7ff;
      border: 1px solid #44d9ff;
      border-radius: 8px;
      padding: 0 16px;
      cursor: pointer;
      font-family: inherit;
    }

    button:hover {
      background: #16425e;
    }

    .small {
      margin-top: 12px;
      color: #789;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Jarvis</h1>

    <div class="warning">
      Safe mode är aktiv. Ingen 3D, ingen WebGL, ingen Graphify, ingen NeuroLinked-simulation.
    </div>

    <div id="messages"></div>

    <div class="row">
      <input id="input" placeholder="Skriv till Jarvis..." autocomplete="off">
      <button id="send">Skicka</button>
    </div>

    <div class="small">
      Tips: Tryck pil upp i textrutan för att hämta senaste skrivna meddelandet.
    </div>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    const messageHistory = [];
    let historyIndex = 0;

    window.jarvisAddMessage = function(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "assistant");
      div.textContent = (role === "user" ? "Du: " : "Jarvis: ") + String(text || "");
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    };

    function rememberMessage(text) {
      if (!text) return;
      if (messageHistory[messageHistory.length - 1] !== text) {
        messageHistory.push(text);
      }
      historyIndex = messageHistory.length;
    }

    function showPreviousMessage() {
      if (messageHistory.length === 0) return;

      historyIndex = Math.max(0, historyIndex - 1);
      input.value = messageHistory[historyIndex];
      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }

    function showNextMessage() {
      if (messageHistory.length === 0) return;

      historyIndex = Math.min(messageHistory.length, historyIndex + 1);

      if (historyIndex >= messageHistory.length) {
        input.value = "";
      } else {
        input.value = messageHistory[historyIndex];
      }

      setTimeout(() => input.setSelectionRange(input.value.length, input.value.length), 0);
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      rememberMessage(text);

      input.value = "";
      window.jarvisAddMessage("user", text);

      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({
          type: "jarvis_chat",
          text: text
        });
      } else {
        window.jarvisAddMessage("assistant", "Ingen C#-brygga hittades. Starta via Jarvis-appen.");
      }
    }

    send.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
        return;
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        showPreviousMessage();
        return;
      }

      if (event.key === "ArrowDown") {
        event.preventDefault();
        showNextMessage();
        return;
      }
    });

    window.jarvisAddMessage("assistant", "Jarvis dashboard laddad.");
  </script>
</body>
</html>
